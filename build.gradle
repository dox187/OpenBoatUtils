plugins {
    id 'fabric-loom' version "${loom_version}" apply false
    id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
    id 'maven-publish'
}

// Minecraft 26.x is unobfuscated and needs loom's no-remap plugin; older versions need the
// remapping one. A plugins block cannot be conditional, so both resolve and one gets applied.
apply plugin: project.loom_plugin

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {

}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    if (project.loom_plugin == 'fabric-loom') {
        mappings loom.officialMojangMappings()
        modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    } else {
        implementation "net.fabricmc:fabric-loader:${project.loader_version}"
        implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    }
}

def rawVersion = project.findProperty("mod_version")
def resolvedVersion = rawVersion.replace("\${base_version}", base_version)

version = resolvedVersion

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "minecraft_version_allowed_range", project.minecraft_version_allowed_range
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "minecraft_version_allowed_range": project.minecraft_version_allowed_range,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = project.java_release as int
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}" }
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}

loom {
    runConfigs.all {
        ideConfigGenerated true // Run configurations are not created for subprojects by default
        runDir "../../run" // Use a shared run folder and just create separate worlds
    }
}

stonecutter {
    // Replacement rules run in both directions: on a version where the predicate is false the
    // target is rewritten back to the pattern. Every pattern must therefore be a token that
    // cannot occur in this mod's own identifiers, hence the word boundaries.

    // The boat class is Boat on 1.21 and AbstractBoat from 1.21.3 onwards; the checked-in
    // sources carry the 1.21 name. This rule and the package rule below match disjoint spans,
    // so switching directly between any two versions composes correctly.
    replacements.regex(
            current.parsed.matches('>=1.21.3'),
            "!boat_entity"
    ) {
        replace '\\bBoat\\b', 'AbstractBoat', '\\bAbstractBoat\\b', 'Boat'
    }

    // 1.21.10 moved the boat classes into world.entity.vehicle.boat; VehicleEntity and the
    // minecarts stayed in world.entity.vehicle, so only the boat family's package segment may be
    // rewritten. The class name is matched by a lookahead instead of being consumed: overlapping
    // matches are discarded, so claiming those characters here would swallow the !boat_entity
    // rewrite and leave the leaf Boat class hooked. Requiring a boat name after the segment also
    // makes each direction idempotent, since neither pattern matches its own output.
    def boatClasses = '(?:AbstractChestBoat|AbstractBoat|ChestBoat|ChestRaft|Boat|Raft)\\b'
    replacements.regex(
            current.parsed.matches('>=1.21.10'),
            "!boat_package"
    ) {
        replace "net\\.minecraft\\.world\\.entity\\.vehicle\\.(?=$boatClasses)", 'net.minecraft.world.entity.vehicle.boat.',
                "net\\.minecraft\\.world\\.entity\\.vehicle\\.boat\\.(?=$boatClasses)", 'net.minecraft.world.entity.vehicle.'
        replace "net/minecraft/world/entity/vehicle/(?=$boatClasses)", 'net/minecraft/world/entity/vehicle/boat/',
                "net/minecraft/world/entity/vehicle/boat/(?=$boatClasses)", 'net/minecraft/world/entity/vehicle/'
    }

    // 1.21.10 renamed ResourceLocation to Identifier.
    replacements.regex(
            current.parsed.matches('>=1.21.10'),
            "!identifier"
    ) {
        replace '\\bResourceLocation\\b', 'Identifier', '\\bIdentifier\\b', 'ResourceLocation'
    }

    replacements.regex(
            current.parsed.matches('>=26'),
            "!mc26"
    ) {
        replace '\\bWaterlilyBlock\\b', 'LilyPadBlock', '\\bLilyPadBlock\\b', 'WaterlilyBlock'
        replace '\\bPacketByteBufs\\b', 'FriendlyByteBufs', '\\bFriendlyByteBufs\\b', 'PacketByteBufs'
        replace '\\bplayS2C\\b', 'clientboundPlay', '\\bclientboundPlay\\b', 'playS2C'
        replace '\\bplayC2S\\b', 'serverboundPlay', '\\bserverboundPlay\\b', 'playC2S'
        replace '\\bconfigurationS2C\\b', 'clientboundConfiguration', '\\bclientboundConfiguration\\b', 'configurationS2C'
        replace '\\bconfigurationC2S\\b', 'serverboundConfiguration', '\\bserverboundConfiguration\\b', 'configurationC2S'
        replace 'renderer\\.state\\.CameraRenderState', 'renderer.state.level.CameraRenderState', 'renderer\\.state\\.level\\.CameraRenderState', 'renderer.state.CameraRenderState'
    }
}
